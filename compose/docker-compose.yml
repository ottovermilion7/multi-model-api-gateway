services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      ARGO_API_KEY: "${ARGO_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 3
